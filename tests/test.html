<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>単体試験</title>
<style>
  body { font-family: "Yu Gothic UI", "Meiryo UI", sans-serif; font-size: 13px; margin: 16px; color: #1f2933; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .note { color: #52606d; margin: 0 0 12px; }
  .summary { font-weight: bold; padding: 6px 10px; border-radius: 3px; display: inline-block; }
  .summary.pass { background: #e3f4e8; color: #1d6b38; }
  .summary.fail { background: #fbe4e4; color: #a12323; }
  table { border-collapse: collapse; margin-top: 12px; width: 100%; }
  th, td { border: 1px solid #cbd2d9; padding: 4px 6px; text-align: left; vertical-align: top; }
  th { background: #eef1f4; }
  tr.fail td { background: #fbe4e4; color: #a12323; }
  #result-text { display: none; }
</style>
</head>
<body>

<div id="result-body"></div>
